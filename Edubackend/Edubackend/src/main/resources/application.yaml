spring:
  application:
    name: EduBaka
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edubaka_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

app:
  security:
    jwt:
      secret: ${JWT_SECRET:defaultSecretKeyEduBaka2024_MakeSureItsLongEnough!}
      expiration-ms: 3600000 # 1 hour
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  chat:
    daily-limit: ${CHAT_DAILY_LIMIT:30}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-lite-latest}

server:
  port: 8080
  servlet:
    session:
      persistent: false
